<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Điền Phiếu Dự Thi Hàng Loạt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        input[type="file"] { display: block; width: 100%; padding: 8px; border: 1px dashed #bdc3c7; border-radius: 4px; cursor: pointer; background-color: #f9fcfc; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #219150; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #status-box { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
        .status-processing { background-color: #fef9e7; color: #d35400; display: block !important; }
        .status-success { background-color: #e8f8f5; color: #16a085; display: block !important; }
        .status-error { background-color: #fdedec; color: #c0392b; display: block !important; }
        /* NEW: banner trên cùng */
        .top-banner {
            color: #1e88e5; /* xanh dương */
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 18px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-banner">TỪ LAM ĐAI I ĐẾN LAM ĐAI IV</div>
        <h2>Tự Động Tạo Phiếu Dự Thi</h2>

        <div class="form-group">
            <label>1. Chọn File Danh Sách (Excel):</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls" />
        </div>

        <div class="form-group">
            <label>2. Chọn Phôi Ảnh (JPG/PNG):</label>
            <input type="file" id="template-file" accept="image/jpeg, image/png" />
        </div>

        <div class="form-group">
            <label>3. Chọn Thư Mục Chứa Ảnh Thẻ:</label>
            <input type="file" id="photo-folder" webkitdirectory directory multiple />
        </div>

        <button id="run-btn" onclick="processData()">🚀 BẮT ĐẦU XUẤT FILE ZIP</button>

        <div id="status-box"></div>
    </div>

    <script>
        // Tọa độ X, Y đã được căn chỉnh lại cho phôi LAM_DAI_MOI.png
        const textCoords = {
            'STT': {x: 2250, y: 155}, // Ô STT góc trên phải (bạn có thể tăng giảm x để căn giữa ô)
            
            // Dòng 1
            'Họ và Tên': {x: 320, y: 835},
            'Năm sinh': {x: 1250, y: 835},
            'Giới tính': {x: 1750, y: 835},
            
            // Dòng 2, 3, 4
            'Địa chỉ': {x: 250, y: 920},
            'Đơn vị': {x: 250, y: 1005},
            'Văn bằng': {x: 1050, y: 1090},
            
            // Dòng 5
            'Ngày cấp': {x: 320, y: 1175},
            'Nơi cấp': {x: 920, y: 1175},
            'Cơ quan cấp': {x: 1450, y: 1175},
            
            // Dòng 6
            'Trình độ văn hóa': {x: 460, y: 1260},
            'Số điện thoại': {x: 950, y: 1260},
            'HLV Bảo Lãnh': {x: 1750, y: 1260},
            
            // Dòng 7
            'Xin dự thi cấp': {x: 420, y: 1345},
            
            // Chữ ký (Góc dưới cùng bên phải)
            'Ngày':{x: 1880, y: 2570},
            'Tháng':{x: 2050, y: 2570},
            'Năm':{x: 2260, y: 2570}
        };

        // Tọa độ và kích thước khung ảnh thẻ (căn chỉnh lại cho khung mới)
        const photoBounds = { x: 225, y: 295, width: 290, height: 390 };
        // Hàm tiện ích: Tải file ảnh thành đối tượng Image của HTML
        const loadImage = (file) => {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        };

        async function processData() {
            const excelInput = document.getElementById('excel-file');
            const templateInput = document.getElementById('template-file');
            const folderInput = document.getElementById('photo-folder');
            const statusBox = document.getElementById('status-box');
            const runBtn = document.getElementById('run-btn');

            if (!excelInput.files[0] || !templateInput.files[0] || folderInput.files.length === 0) {
                alert("Vui lòng chọn đầy đủ Excel, Phôi ảnh và Thư mục ảnh thẻ!");
                return;
            }

            runBtn.disabled = true;
            statusBox.className = "status-processing";
            statusBox.innerText = "Đang đọc dữ liệu...";

            try {
                // 1. Đọc dữ liệu từ file Excel
                const excelData = await excelInput.files[0].arrayBuffer();
                const workbook = XLSX.read(excelData);
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);

                if (rows.length === 0) throw new Error("File Excel không có dữ liệu!");

                // 2. Tạo bản đồ tra cứu ảnh thẻ nhanh (Tên file -> File object)
                const photoMap = {};
                for (let file of folderInput.files) {
                    photoMap[file.name] = file;
                }

                // 3. Tải phôi ảnh lên
                const templateImg = await loadImage(templateInput.files[0]);

                // Khởi tạo đối tượng tạo ZIP
                const zip = new JSZip();

                // Khởi tạo Canvas để vẽ
                const canvas = document.createElement('canvas');
                canvas.width = templateImg.width;
                canvas.height = templateImg.height;
                const ctx = canvas.getContext('2d');

                // 4. Lặp qua từng dòng dữ liệu (từng võ sinh)
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    statusBox.innerText = `Đang xử lý hồ sơ ${i + 1} / ${rows.length}...`;

                    // Giúp UI không bị treo bằng cách nhường quyền xử lý một chút
                    await new Promise(r => setTimeout(r, 10)); 

                    // Vẽ lại phôi mới
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(templateImg, 0, 0);

                    // Xử lý vẽ ảnh thẻ
                    const photoName = row['Tên ảnh thẻ'];
                    if (photoName && photoMap[photoName]) {
                        const studentImg = await loadImage(photoMap[photoName]);
                        if (studentImg) {
                            ctx.drawImage(studentImg, photoBounds.x, photoBounds.y, photoBounds.width, photoBounds.height);
                        }
                    }

                    // Thiết lập mặc định
                    ctx.textBaseline = "top"; 

                    // Điền Text
                    for (const [key, coords] of Object.entries(textCoords)) {
                        let value = row[key];

                        // Nâng cấp: Tự động đánh số STT nếu cột STT trống hoặc không có trong Excel
                        if (key === 'STT' && (value === undefined || value === '')) {
                            value = String(i + 1).padStart(2, '0'); // Ví dụ: 01, 02, 03...
                        }

                        if (value !== undefined && value !== null) {
                            // Cài đặt phông chữ đặc biệt cho ô STT để nó nổi bật hơn
                            if (key === 'STT') {
                                ctx.font = "bold 60px 'Times New Roman'"; // In đậm và to hơn
                                ctx.fillStyle = "black"; // Chuyển thành "red" nếu muốn STT màu đỏ
                            } else {
                                ctx.font = "50px 'Times New Roman'";
                                ctx.fillStyle = "black";
                            }
                            
                            ctx.fillText(String(value), coords.x, coords.y);
                        }
                    }

                    // Lấy dữ liệu ảnh và lưu vào ZIP
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));

                    // Xử lý tạo tên chuẩn
                    const rawName = String(row['Họ và Tên'] || 'KhongTen');
                    const cleanName = rawName.replace(/\s+/g, ''); // Bỏ toàn bộ khoảng trắng
                    const serial = String(i + 1).padStart(3, '0'); // Định dạng 001, 002...

                    const fileName = `${serial}_${cleanName}_Certificate.jpg`;

                    zip.file(fileName, blob);
                }

                statusBox.innerText = "Đang nén file ZIP, vui lòng đợi giây lát...";

                // 5. Xuất file ZIP
                const zipBlob = await zip.generateAsync({type: 'blob'});
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(zipBlob);
                downloadLink.download = "DanhSach_PhieuDuThi_Lamdai.zip";
                downloadLink.click();

                statusBox.className = "status-success";
                statusBox.innerText = `✅ Hoàn tất! Đã nén thành công ${rows.length} phiếu dự thi.`;

            } catch (error) {
                console.error(error);
                statusBox.className = "status-error";
                statusBox.innerText = `❌ Lỗi: ${error.message}`;
            } finally {
                runBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
